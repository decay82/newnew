<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Tetris</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-wrapper {
            display: flex;
            gap: 20px;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .title { margin-bottom: 5px; font-weight: bold; }
        #status {
            margin-bottom: 20px;
            font-size: 24px;
            color: #FFD700;
            height: 30px;
            text-align: center;
        }

        /* 메인 버튼 스타일 */
        #actionBtn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: bold;
        }
        #actionBtn:hover { transform: scale(1.05); }
        #actionBtn:disabled { background: #555; cursor: not-allowed; transform: none; }

        /* 시작 가능 상태 (빨간색) */
        #actionBtn.start-ready {
            background: #FF5252;
            animation: pulse 1s infinite;
        }

        /* 초기화 버튼 스타일 */
        #resetBtn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 14px;
            background: #d32f2f;
            color: white;
            border: 1px solid #b71c1c;
            border-radius: 4px;
            cursor: pointer;
        }
        #resetBtn:hover { background: #b71c1c; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="status">접속 대기 중...</div>

    <div class="game-wrapper">
        <div class="screen">
            <div class="title">나 (ME)</div>
            <canvas id="myCanvas" width="240" height="400"></canvas>
            <div id="score">Score: 0</div>
        </div>
        <div class="screen">
            <div class="title">상대방 (OPPONENT)</div>
            <canvas id="opponentCanvas" width="240" height="400"></canvas>
            <div>Target</div>
        </div>
    </div>

    <button id="actionBtn">준비 (Ready)</button>

    <button id="resetBtn">⚠ 방 초기화 (오류 시 클릭)</button>

<script>
    // 1. 전역 변수 선언
    let myCanvas, myCtx, oppCanvas, oppCtx;
    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

    let myArena, oppArena, player;
    let isGameRunning = false;
    let amIHost = false;
    let myStatus = 'idle';
    let myId = 'player_' + Math.floor(Math.random() * 100000);

    // Firebase 변수
    let db, roomRef, myRef, gameStatusRef;

    // 2. 초기화 (페이지 로드 시 실행)
    window.addEventListener('load', function() {
        console.log("페이지 로드 완료. 초기화 시작...");

        // 버튼 이벤트 리스너 연결 (HTML onclick 대신 여기서 연결)
        document.getElementById('actionBtn').addEventListener('click', handleBtnClick);
        document.getElementById('resetBtn').addEventListener('click', resetRoom);

        const firebaseConfig = {
            apiKey: "AIzaSyDV93ZWJCLPiMfpNJtwmLUF_iSPbGfry68",
            authDomain: "tetrisreal-57f2d.firebaseapp.com",
            projectId: "tetrisreal-57f2d",
            storageBucket: "tetrisreal-57f2d.firebasestorage.app",
            databaseURL: "https://tetrisreal-57f2d-default-rtdb.asia-southeast1.firebasedatabase.app",
            messagingSenderId: "160806699496",
            appId: "1:160806699496:web:4711929c5eeb0baa90645d",
            measurementId: "G-VBT2F8944T"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        roomRef = db.ref('rooms/room1'); // 1번 방 고정
        myRef = roomRef.child('players/' + myId);
        gameStatusRef = roomRef.child('gameStatus');

        // 캔버스 세팅
        myCanvas = document.getElementById('myCanvas');
        myCtx = myCanvas.getContext('2d');
        oppCanvas = document.getElementById('opponentCanvas');
        oppCtx = oppCanvas.getContext('2d');

        myCtx.scale(20, 20);
        oppCtx.scale(20, 20);

        // 게임 변수 초기화
        myArena = createMatrix(12, 20);
        oppArena = createMatrix(12, 20);
        player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        // Firebase 접속 등록
        myRef.set({
            id: myId,
            status: 'idle',
            arena: myArena,
            gameOver: false
        });
        myRef.onDisconnect().remove();

        // 리스너 시작
        setupFirebaseListeners();

        console.log("초기화 완료. myId:", myId);
    });

    // 3. 버튼 핸들러
    function handleBtnClick() {
        const btn = document.getElementById('actionBtn');

        console.log("버튼 클릭! myStatus:", myStatus, "amIHost:", amIHost, "hasStartReady:", btn.classList.contains('start-ready'));

        // 준비 안 했으면 -> 준비 상태로
        if (myStatus === 'idle') {
            myStatus = 'ready';
            myRef.update({ status: 'ready' });
            btn.innerText = "대기 중...";
            btn.disabled = true;
            console.log("→ 준비 완료! Firebase 업데이트");
        }
        // 내가 방장이고 시작 가능하면 -> 시작 신호 전송
        else if (myStatus === 'ready' && amIHost && btn.classList.contains('start-ready')) {
            console.log("→ 게임 시작 신호 전송!");
            gameStatusRef.set({ state: 'running', startTime: Date.now() });
        }
    }

    // 4. 방 초기화 함수
    function resetRoom() {
        if (confirm("정말로 방 데이터를 초기화하시겠습니까?\n(모든 접속자의 연결이 끊깁니다)")) {
            // roomRef가 정의되지 않았을 경우를 대비해 안전장치
            if(roomRef) {
                roomRef.remove().then(() => {
                    alert("초기화 완료! 페이지를 새로고침 합니다.");
                    location.reload();
                });
            } else {
                alert("Firebase 연결이 아직 안 됐습니다. 잠시 후 다시 시도하세요.");
            }
        }
    }

    // 5. Firebase 데이터 동기화
    function setupFirebaseListeners() {
        roomRef.on('value', snapshot => {
            const data = snapshot.val();

            // 데이터가 없거나 플레이어가 없으면 대기
            if (!data || !data.players) {
                document.getElementById('status').innerText = "접속 대기 중...";
                return;
            }

            const players = data.players;
            const playerKeys = Object.keys(players).sort(); // ID 정렬로 방장 선정

            // ✅ 핵심 수정: Firebase에서 내 상태 동기화
            if (players[myId]) {
                myStatus = players[myId].status;
                console.log("Firebase 동기화: myStatus =", myStatus);
            }

            // 내가 방장인지 확인 (가장 먼저 들어온 사람)
            amIHost = (playerKeys[0] === myId);
            console.log("amIHost:", amIHost, "playerKeys:", playerKeys);

            // 두 명 다 준비 상태인지 확인
            const allReady = playerKeys.length === 2 && playerKeys.every(k => players[k].status === 'ready');
            console.log("allReady:", allReady, "playerCount:", playerKeys.length);

            const btn = document.getElementById('actionBtn');
            const statusDiv = document.getElementById('status');

            // 게임 시작 전 UI 상태 관리 (State Machine 방식)
            if (!isGameRunning) {
                // 1. 혼자일 때
                if (playerKeys.length < 2) {
                    statusDiv.innerText = "상대방 기다리는 중... (현재 1명)";
                    btn.innerText = "대기 중...";
                    btn.disabled = true;
                    btn.classList.remove('start-ready');
                }
                // 2. 둘 다 접속했지만, 아직 모두 준비 안 됨
                else if (!allReady) {
                    statusDiv.innerText = "모두 준비(Ready)를 눌러야 합니다.";

                    // 내 상태에 따라 버튼 모양 결정
                    if (myStatus === 'ready') {
                        btn.innerText = "준비 완료 (대기 중...)";
                        btn.disabled = true; // 나는 눌렀으니 비활성
                    } else {
                        btn.innerText = "준비 (Ready)";
                        btn.disabled = false; // 안 눌렀으니 활성
                    }
                    btn.classList.remove('start-ready');
                }
                // 3. 둘 다 준비 완료됨
                else if (allReady) {
                    if (amIHost) {
                        // 방장: 시작 버튼 활성화
                        statusDiv.innerText = "모두 준비 완료! 시작 버튼을 누르세요.";
                        btn.innerText = "게임 시작 (START)";
                        btn.disabled = false; // ✅ 버튼 잠금 해제
                        btn.classList.add('start-ready'); // 빨간색 강조
                        console.log("→ 방장: 시작 버튼 활성화!");
                    } else {
                        // 일반 유저: 방장 대기
                        statusDiv.innerText = "방장이 곧 게임을 시작합니다...";
                        btn.innerText = "방장 시작 대기 중...";
                        btn.disabled = true;
                        btn.classList.remove('start-ready');
                    }
                }
            }

            // 상대방 화면 그리기 & 승리 판정 (기존과 동일)
            playerKeys.forEach(key => {
                if (key !== myId) {
                    const opp = players[key];
                    if (opp.arena) {
                        oppArena = opp.arena;
                        if (!isGameRunning) draw();
                    }
                    if (isGameRunning && opp.gameOver) {
                        endGame("YOU WIN! (상대방 탈락)");
                    }
                }
            });

            // 게임 시작 신호 감지
            if (data.gameStatus && data.gameStatus.state === 'running' && !isGameRunning) {
                console.log("→ 게임 시작 신호 수신!");
                startGameReal();
            }
        });
    }

    // 6. 게임 로직
    function startGameReal() {
        isGameRunning = true;
        myStatus = 'playing';
        document.getElementById('actionBtn').style.display = 'none'; // 버튼 숨김
        document.getElementById('resetBtn').style.display = 'none'; // 게임 중엔 초기화 숨김
        document.getElementById('status').innerText = "🔥 게임 시작! 🔥";

        myArena = createMatrix(12, 20);
        player.score = 0;
        playerReset();
        updateScore();
        update();
    }

    function endGame(msg) {
        isGameRunning = false;
        document.getElementById('status').innerText = msg;
        alert(msg);
        document.getElementById('resetBtn').style.display = 'block'; // 다시 표시
    }

    // --- 테트리스 로직 (변경 없음) ---
    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }
    function createPiece(type) {
        if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
        if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
        if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
        if (type === 'O') return [[4, 4], [4, 4]];
        if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
        if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
    }
    function drawMatrix(ctx, matrix, offset) {
        if (!matrix) return;
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    ctx.fillStyle = colors[value];
                    ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    ctx.lineWidth = 0.05;
                    ctx.strokeStyle = 'white';
                    ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }
    function draw() {
        if(!myCtx || !oppCtx) return;
        myCtx.fillStyle = '#000';
        myCtx.fillRect(0, 0, myCanvas.width, myCanvas.height);
        drawMatrix(myCtx, myArena, {x: 0, y: 0});
        drawMatrix(myCtx, player.matrix, player.pos);

        oppCtx.fillStyle = '#000';
        oppCtx.fillRect(0, 0, oppCanvas.width, oppCanvas.height);
        drawMatrix(oppCtx, oppArena, {x: 0, y: 0});
    }
    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }
    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }
    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(myArena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }
    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }
    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = myArena.length -1; y > 0; --y) {
            for (let x = 0; x < myArena[y].length; ++x) {
                if (myArena[y][x] === 0) continue outer;
            }
            const row = myArena.splice(y, 1)[0].fill(0);
            myArena.unshift(row);
            ++y;
            player.score += rowCount * 10;
            rowCount *= 2;
        }
    }
    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (myArena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        if (collide(myArena, player)) {
            myRef.update({ gameOver: true });
            endGame("패배했습니다...");
        }
    }
    function playerDrop() {
        player.pos.y++;
        if (collide(myArena, player)) {
            player.pos.y--;
            merge(myArena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }
    function updateScore() {
        document.getElementById('score').innerText = "Score: " + player.score;
    }

    let lastTime = 0;
    let dropCounter = 0;
    let dropInterval = 1000;

    function update(time = 0) {
        if (!isGameRunning) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();

        myRef.update({ arena: myArena });
        requestAnimationFrame(update);
    }

    // 키보드 조작
    document.addEventListener('keydown', event => {
        if (!isGameRunning) return;

        if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
            event.preventDefault();
        }

        if (event.keyCode === 37) { // Left
            player.pos.x--;
            if (collide(myArena, player)) player.pos.x++;
        } else if (event.keyCode === 39) { // Right
            player.pos.x++;
            if (collide(myArena, player)) player.pos.x--;
        } else if (event.keyCode === 40) { // Down
            playerDrop();
        } else if (event.keyCode === 81) { // Q
            playerRotate(-1);
        } else if (event.keyCode === 87 || event.keyCode === 38) { // W or Up
            playerRotate(1);
        } else if (event.keyCode === 32) { // Space
            while (!collide(myArena, player)) player.pos.y++;
            player.pos.y--;
            merge(myArena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }
        draw();
    });
</script>
</body>
</html>
